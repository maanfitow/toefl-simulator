[isort]
profile = black
line_length = 99
known_django = django
known_libs = toefl_simulator.libs
known_first_party = toefl_simulator
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,LIBS,FIRSTPARTY,LOCALFOLDER
skip = migrations,settings,.venv,venv

[coverage:run]
omit =
  core/settings.py
  manage.py
  /*/migrations/*
source = .

[flake8]
exclude = .svn,CVS,.bzr,.hg,.git,__pycache__,.tox,migrations,templates,.ipython,local.py,node_modules,.html,.venv,venv
max-complexity = 10
max-line-length = 99
inline-quotes = "
