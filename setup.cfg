[isort]
combine_as_imports = true
default_section = THIRDPARTY
include_trailing_comma = true
known_django = django
known_libs = toefl_simulator.libs
known_first_party = toefl_simulator
known_standard_library = requests
lines_after_imports = 2
line_length = 99
multi_line_output = 3
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,LIBS,FIRSTPARTY,LOCALFOLDER
skip = migrations,settings

;[tool:pytest]
;DJANGO_SETTINGS_MODULE = kaptur.settings.testing
;python_files = tests.py test_*.py *_tests.py
;addopts = --cov=src/ --cov-config=setup.cfg --cov-report=term:skip-covered --no-cov-on-fail --tb=native --create-db
;markers =
;  integration: tests an integration
;filterwarnings =
;    ignore::PendingDeprecationWarning:fernet_fields
;    ignore::django.utils.deprecation.RemovedInDjango40Warning

[coverage:run]
omit =
  toefl_simulator/settings.py
  manage.py
  /*/migrations/*
source = .

[flake8]
exclude = .svn,CVS,.bzr,.hg,.git,__pycache__,.tox,migrations,templates,.ipython,local.py,node_modules,.html,.venv,venv
max-complexity = 10
max-line-length = 99
inline-quotes = "
